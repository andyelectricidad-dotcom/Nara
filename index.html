<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Diario de Nara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Semi+Condensed:wght@500;700;800&family=Orbitron:wght@700;900&display=swap">
    
    <script>
        window.onerror = function(msg, url, line) {
            document.body.innerHTML += `<div style="color:red; background:white; padding:15px; border-radius:10px; margin:20px; text-align:center; font-weight:bold;">Error: ${msg} <br>Línea: ${line}</div>`;
        };
    </script>

    <style>
        body { 
            background-color: #121212; color: #ffffff; 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; padding: 15px; 
            display: flex; flex-direction: column; align-items: center; 
        }
        .container { width: 100%; max-width: 400px; padding-bottom: 30px; }
        
        /* AUTH & SETUP SCREENS */
        .full-screen-center { display: flex; flex-direction: column; justify-content: center; height: 90vh; }
        .auth-logo { text-align: center; font-size: 65px; margin-bottom: 10px; text-shadow: 0 4px 15px rgba(0,0,0,0.5); }
