<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <title>Diario de Nara</title>
    
    <script>
        window.onerror = function(msg, url, line) {
            document.body.innerHTML += `<div style="color:red; background:white; padding:15px; border-radius:10px; margin:20px; text-align:center; font-weight:bold;">Error: ${msg} <br>Línea: ${line}</div>`;
        };
    </script>

    <style>
        body { 
            background-color: #121212; color: #ffffff; 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; padding: 15px; 
            display: flex; flex-direction: column; align-items: center; 
        }
        .container { width: 100%; max-width: 400px; padding-bottom: 30px; }
        
        /* AUTH & SETUP SCREENS */
        .full-screen-center { display: flex; flex-direction: column; justify-content: center; height: 90vh; }
        .auth-logo { text-align: center; font-size: 65px; margin-bottom: 10px; text-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .logo-wrapper { position: relative; display: inline-block; }
        .logo-pacifier { position: absolute; bottom: 0px; right: -15px; font-size: 35px; transform: rotate(-15deg); }
        .auth-title { text-align: center; font-size: 28px; font-weight: bold; margin-bottom: 5px; color: #4CAF50; letter-spacing: -0.5px;}
        .auth-subtitle { text-align: center; font-size: 14px; color: #aaa; margin-bottom: 35px; }
        
        .auth-btn { padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; border: none; display: flex; justify-content: center; align-items: center; transition: transform 0.2s; margin-bottom: 12px; box-sizing: border-box; }
        .auth-btn:active { transform: scale(0.98); filter: brightness(0.9); }
        .auth-btn-primary { background: #4CAF50; color: white; box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3); }
        .auth-btn-outline { background: transparent; color: #ccc; border: 1px solid #444; }
        .auth-btn-google { background: white; color: #333; box-shadow: 0 2px 8px rgba(255, 255, 255, 0.1); }
        
        .auth-divider { display: flex; align-items: center; margin: 15px 0 20px 0; width: 100%; }
        .auth-divider .line { flex-grow: 1; height: 1px; background: #333; }
        .auth-divider span { padding: 0 15px; color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

        .invite-banner { background: #4CAF50; color: white; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 25px; display: none; box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4); border: 2px solid #81C784;}
        .invite-banner h3 { margin: 0 0 5px 0; font-size: 18px; }
        .invite-banner p { margin: 0; font-size: 13px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { font-size: 13px; font-weight: bold; color: #aaa; margin-bottom: 5px; text-transform: uppercase; display: block;}
        .styled-input { background: #222; color: white; border: 1px solid #333; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; width: 100%; box-sizing: border-box; margin-bottom: 15px; transition: border-color 0.3s;}
        .styled-input:focus { outline: none; border-color: #4CAF50; }
        
        .settings-card { background: #1e1e1e; padding: 16px; border-radius: 16px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 15px; border: 1px solid #333;}
        .settings-grid { display: flex; gap: 15px; width: 100%; }
        .settings-col { flex: 1; display: flex; flex-direction: column; }
        
        .stock-banner { background: #1976D2; color: white; padding: 12px; border-radius: 10px; text-align: center; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 8px rgba(25, 118, 210, 0.4); }
        .stock-banner:active { transform: scale(0.98); }
        .btn-invite { background: #4CAF50; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; font-size: 14px; cursor: pointer; }
        .btn-migrate { background: #9C27B0; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; font-size: 14px; cursor: pointer; }

        /* App Header */
        .header { text-align: center; margin-top: 10px; margin-bottom: 15px; }
        .total-text { font-size: 48px; font-weight: bold; margin-bottom: 5px; transition: color 0.3s; }
        
        .glass-container { width: 100%; height: 20px; background-color: #2a2a2a; border-radius: 10px; position: relative; overflow: hidden; margin: 10px 0; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
        .glass-fill { height: 100%; background-color: #EF5350; width: 0%; transition: width 0.5s ease-out, background-color 0.3s; border-radius: 10px; }
        .target-info { font-size: 14px; color: #a0a0a0; margin-bottom: 15px; font-weight: bold;}
        
        /* Timer a 2 líneas */
        .timer-container { background: #1e1e1e; padding: 10px 15px; border-radius: 12px; display: inline-block; text-align: left;}
        .timer-line { font-size: 14px; color: #e0e0e0; font-weight: bold; margin-bottom: 4px;}
        .timer-next { font-size: 15px; color: #4CAF50; font-weight: bold; }
        
        .divider { height: 1px; background: #333; margin: 20px 0; }
        
        /* Controls */
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-adjust { background: #222; border: 2px solid #555; color: white; border-radius: 50%; width: 60px; height: 60px; font-size: 32px; display: flex; justify-content: center; align-items: center; cursor: pointer; touch-action: manipulation; transition: background 0.2s;}
        .btn-adjust:active { background: #444; }
        .amount-text { font-size: 48px; font-weight: bold; text-align: center; flex-grow: 1; }
        
        .btn-save { background: #1976D2; color: white; border: none; border-radius: 16px; width: 100%; padding: 20px; font-size: 22px; font-weight: bold; cursor: pointer; touch-action: manipulation; box-shadow: 0 4px 15px rgba(25, 118, 210, 0.4); margin-bottom: 12px; }
        .btn-save:active { background: #1565C0; transform: scale(0.98); }
        
        .secondary-actions { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn-secondary { flex: 1; padding: 12px 5px; border-radius: 12px; border: none; font-size: 14px; font-weight: bold; color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 5px; transition: background 0.3s; }
        .btn-poop { background: #795548; }
        .btn-manual { background: #424242; }
        .btn-vitd { background: #F57F17; } 
        .btn-secondary:active { transform: scale(0.96); filter: brightness(0.8); }

        /* Calendar */
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #e0e0e0; display: flex; justify-content: space-between; align-items: center;}
        .legend { font-size: 11px; display: flex; gap: 8px; font-weight: normal;}
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
        .calendar-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: #888; margin-bottom: 8px; font-weight: bold; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 10px; }
        .day-cell { aspect-ratio: 1; background-color: #1a1a1a; border-radius: 8px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #222;}
        .day-fill { position: absolute; bottom: 0; left: 0; width: 100%; transition: height 0.5s, background-color 0.3s; z-index: 1; opacity: 0.35; }
        .day-text { position: relative; z-index: 2; font-size: 15px; font-weight: bold; text-shadow: 0px 1px 3px rgba(0,0,0,0.9); }
        .day-ml { position: relative; z-index: 2; font-size: 10px; color: #eee; text-shadow: 0px 1px 3px rgba(0,0,0,0.9); margin-top: -2px; }

        /* History */
        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item { background: #1e1e1e; padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2a2a2a;}
        .history-amount { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 10px;}
        .history-time { color: #a0a0a0; font-size: 14px; }
        .btn-delete { background: transparent; border: none; color: #EF5350; font-size: 18px; cursor: pointer; padding: 5px; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; backdrop-filter: blur(5px); }
        .modal-content { background: #121212; width: 100%; max-width: 360px; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); max-height: 80vh; display: flex; flex-direction: column; border: 1px solid #333; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-title { font-size: 22px; font-weight: bold; }
        .close-btn { background: transparent; border: none; color: white; font-size: 28px; cursor: pointer; padding: 0; line-height: 1; }
        .modal-subtitle { font-size: 14px; color: #4CAF50; margin-bottom: 20px; font-weight: bold; }
        .modal-body { overflow-y: auto; flex-grow: 1; padding-right: 5px; }
    </style>
</head>
<body>

    <script>
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const inviteCode = urlParams.get('invite');
            const inviteName = urlParams.get('name');
            if(inviteCode) {
                localStorage.setItem('pending_invite', inviteCode);
                if(inviteName) localStorage.setItem('pending_name', inviteName);
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        } catch(e) {}
    </script>

    <!-- LOGIN -->
    <div id="authScreen" class="container full-screen-center">
        <div id="inviteBanner" class="invite-banner">
            <h3>💌 ¡Tienes una invitación!</h3>
            <p>Inicia sesión para unirte al registro de <b id="inviteBabyName">la familia</b>.</p>
        </div>

        <div class="auth-logo"><div class="logo-wrapper">🦌<span class="logo-pacifier">🍼</span></div></div>
        <div class="auth-title">Diario de Nara</div>
        <div class="auth-subtitle">Gestor familiar sincronizado</div>
        
        <input type="email" id="emailInput" class="styled-input" placeholder="Correo electrónico">
        <input type="password" id="passInput" class="styled-input" placeholder="Contraseña (mínimo 6 letras)">
        
        <button class="auth-btn auth-btn-primary" onclick="login()">Iniciar sesión con Email</button>
        <button class="auth-btn auth-btn-outline" onclick="register()">Crear cuenta nueva</button>
        
        <div class="auth-divider"><div class="line"></div><span>o continuar con</span><div class="line"></div></div>
        
        <button class="auth-btn auth-btn-google" onclick="loginGoogle()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="20" style="margin-right: 10px;"> Google
        </button>
        <p style="text-align: center; color: #666; font-size: 11px; margin-top: 10px;">⚠ IMPORTANTE: Si estás en WhatsApp, dale a <b>"Abrir en el navegador"</b> (Chrome/Safari) para que Google funcione.</p>
        <p id="authError" style="color: #EF5350; text-align: center; margin-top: 10px; font-size: 14px; font-weight: bold;"></p>
    </div>

    <!-- SETUP BEBE -->
    <div id="setupScreen" class="container full-screen-center" style="display: none;">
        <div class="auth-logo">👶</div>
        <div class="auth-title">¡Bienvenido!</div>
